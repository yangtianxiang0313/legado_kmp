# Gradle properties for Legado KMP
# Kotlin/Native Release linking runs in this JVM; 2 GiB fails during whole-program optimization.
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Disable build config feature (not needed for KMP)
android.defaults.buildfeatures.buildconfig=false

# Android
android.nonTransitiveRClass=false
android.useAndroidX=true

# Disable Compose iOS resource sync; the shared module does not ship Compose resources to UIKit host app.
compose.ios.resources.sync=false
